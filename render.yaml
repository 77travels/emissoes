# Blueprint do Render (plano GRATUITO) — deploy em 1 clique:
#   https://render.com/deploy?repo=https://github.com/77travels/emissoes
#
# No plano gratuito o disco do Render é apagado a cada reinício, por isso o
# banco fica no Turso (turso.tech — SQLite na nuvem, plano gratuito):
# ao fazer o deploy, o Render pede os dois valores TURSO_* abaixo.
services:
  - type: web
    name: emissoes-77travels
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/auth/me
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: MASTER_INITIAL_PASSWORD
        value: "77travels"
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL   # ex.: libsql://emissoes-77travels-XXXX.turso.io
        sync: false
      - key: TURSO_AUTH_TOKEN     # token do banco no painel do Turso
        sync: false
